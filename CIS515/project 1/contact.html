<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact - Martin Medina</title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>

    <!-- Banner -->
    <header class="banner">

        <div class="banner-image">
            <img src="images/banner.jpg" alt="Job Application Tracker Banner">
        </div>

        <!-- Navigation -->
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="project.html">Job Tracker Project</a></li>
                <li><a href="mobile.html">From Web to Mobile</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>

    </header>

    <!-- Main Content -->
    <main>

        <h1>Contact Martin Medina</h1>

        <section>

            <h2>Project Feedback</h2>

            <form action="formHandler.html" method="get">

                <div>
                    <label for="name">Name:</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                    >
                </div>

                <div>
                    <label for="email">Email:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >
                </div>

                <div>
                    <label for="subject">Subject:</label>
                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        required
                    >
                </div>

                <div>
                    <label for="message">Message:</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                    ></textarea>
                </div>

                <button type="submit">Submit</button>

            </form>

        </section>

    </main>

    <!-- Footer -->
    <footer id="site-footer">
        <p>&copy; 2026 Martin Medina</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
